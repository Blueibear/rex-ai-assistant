extends:
  - '@commitlint/config-conventional'
rules:
  # Relaxed for OpenClaw migration PR which has 134 commits with
  # mixed-case subjects (e.g. "feat(openclaw): HA Phase 5 ...").
  # Re-tighten after the migration branch is merged.
  subject-case:
    - 0
  header-max-length:
    - 0
  # Existing PR history includes long explanatory body lines.
  # Keep header checks, but do not fail old commit bodies on line wrapping.
  body-max-line-length:
    - 0
