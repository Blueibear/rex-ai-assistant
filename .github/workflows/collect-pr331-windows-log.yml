name: Collect PR331 Windows Log

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/collect-pr331-windows-log.yml

permissions:
  actions: read
  contents: read

jobs:
  collect:
    if: github.head_ref == 'codex/audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Download failed Windows log tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/90115660598/logs" > windows.download
          if unzip -t windows.download >/dev/null 2>&1; then
            unzip -p windows.download > windows.full.log
          else
            cp windows.download windows.full.log
          fi
          tail -n 800 windows.full.log > windows.tail.log

      - name: Upload focused log tail
        uses: actions/upload-artifact@v4
        with:
          name: pr331-windows-failure-tail
          path: windows.tail.log
          if-no-files-found: error
