name: PR419 Python Diagnostic

on:
  push:
    branches: [lead/us124-background-runtime]

permissions:
  contents: read

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          sudo apt-get clean
          pip cache purge || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libasound2-dev portaudio19-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1" "setuptools>=78.1.1" wheel
          pip install -e ".[dev]"

      - name: Run exact CI pytest command
        id: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -m "not slow and not audio and not gpu" -rs --cov=rex --cov-fail-under=75 --cov-report=term-missing --cov-report=xml 2>&1 | tee coverage.txt
        env:
          REX_FILE_LOGGING_ENABLED: "false"

      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr419-python-diagnostic
          path: |
            coverage.txt
            coverage.xml
          if-no-files-found: warn
