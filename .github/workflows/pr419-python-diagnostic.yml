name: PR419 Blocker Diagnostic

on:
  push:
    branches: [lead/us124-background-runtime]

permissions:
  contents: read
  checks: read

jobs:
  blocker-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Read CodeFactor annotations from failing check
        env:
          GH_TOKEN: ${{ github.token }}
          CODEFACTOR_CHECK_ID: "100176618703"
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/${CODEFACTOR_CHECK_ID}/annotations" \
            | jq .

      - name: Compute npm audit lockfile repair without committing
        working-directory: gui
        shell: bash
        run: |
          echo "--- audit before ---"
          npm audit --audit-level=high || true

          echo "--- package-lock-only repair ---"
          npm audit fix --package-lock-only || true

          echo "--- changed files ---"
          git status --short -- package.json package-lock.json
          git diff --stat -- package.json package-lock.json
          echo "--- package.json diff ---"
          git diff -- package.json

          echo "--- relevant resolved versions after repair ---"
          node - <<'NODE'
          const fs = require('fs')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          for (const name of ['browserslist', 'postcss-selector-parser', 'react-router', 'react-router-dom']) {
            const entry = lock.packages?.[`node_modules/${name}`]
            console.log(`${name}: ${entry?.version ?? 'not-found'}`)
          }
          NODE

          echo "--- audit after ---"
          npm audit --audit-level=high || true
