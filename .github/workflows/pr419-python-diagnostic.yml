name: PR419 Audited Lockfile Repair

on:
  push:
    branches: [lead/us124-background-runtime]

permissions:
  contents: write

jobs:
  audited-lockfile-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: lead/us124-background-runtime

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Refresh high-severity transitive dependencies only
        working-directory: gui
        run: npm audit fix --package-lock-only --audit-level=high

      - name: Assert package manifest is unchanged
        run: git diff --exit-code -- gui/package.json

      - name: Verify high-severity audit gate
        working-directory: gui
        run: npm audit --audit-level=high

      - name: Install exact repaired dependencies
        working-directory: gui
        run: npm ci

      - name: Run GUI tests
        working-directory: gui
        run: npm test

      - name: Run GUI typecheck
        working-directory: gui
        run: npm run typecheck

      - name: Build GUI
        working-directory: gui
        run: npm run build

      - name: Commit repaired lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- gui/package-lock.json; then
            echo "No lockfile repair required."
            exit 0
          fi
          if [ -n "$(git status --short --untracked-files=no | grep -v '^ M gui/package-lock.json$' || true)" ]; then
            echo "Unexpected tracked changes detected; refusing automated commit."
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui/package-lock.json
          git commit -m "chore(gui): refresh audited dependencies"
          git push origin HEAD:lead/us124-background-runtime
