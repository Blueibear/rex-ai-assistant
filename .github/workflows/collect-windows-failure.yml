name: Collect Windows Failure

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/collect-windows-failure.yml

permissions:
  actions: read
  contents: read

jobs:
  collect:
    if: github.head_ref == 'codex/audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Download failed Windows log tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/90104274666/logs" > windows.download
          if unzip -t windows.download >/dev/null 2>&1; then
            unzip -p windows.download > windows.full.log
          else
            cp windows.download windows.full.log
          fi
          tail -n 600 windows.full.log > windows.tail.log

      - name: Upload Windows log tail
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-tail
          path: windows.tail.log
          if-no-files-found: error
