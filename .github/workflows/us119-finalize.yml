name: US-119 Finalize Documentation

on:
  push:
    branches: [lead/us119-absolute-service-paths]
    paths:
      - ".github/workflows/us119-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lead/us119-absolute-service-paths
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update canonical guidance and trackers
        run: |
          python - <<'PY'
          from pathlib import Path

          claude = Path('CLAUDE.md')
          text = claude.read_text()
          anchor = '- The supported consumer installation must converge on one packaged AskRex installer with its managed runtime. Do not require normal end users to install Python, Node.js, Git, clone the repo, create a venv, run terminal startup commands, or edit JSON for supported setup.\n'
          rule = '- Windows launcher and service-registration executable paths must derive from `$PSScriptRoot` or another canonical absolute install root. Normalize user-supplied roots before constructing venv/service paths, never persist or execute cwd-relative venv Python paths for services, fail closed when the intended interpreter is missing, and preserve correct quoting for paths containing spaces.\n'
          if rule not in text:
              if anchor not in text:
                  raise SystemExit('CLAUDE install anchor not found')
              text = text.replace(anchor, anchor + rule, 1)
              claude.write_text(text)

          prd = Path('PRD-production-readiness.md')
          text = prd.read_text()
          start = text.index('### US-119:')
          end_candidates = [pos for marker in ('### US-120:', '### US-121:', '### US-124:', '### US-125:') if (pos := text.find(marker, start + 1)) != -1]
          if not end_candidates:
              raise SystemExit('US-119 end marker not found')
          end = min(end_candidates)
          story = text[start:end]
          if '- [ ]' not in story:
              raise SystemExit('US-119 has no unchecked acceptance criteria to finalize')
          story = story.replace('- [ ]', '- [x]')
          text = text[:start] + story + text[end:]
          prd.write_text(text)

          progress = Path('docs/archive/progress/progress-production-readiness.txt')
          evidence = '''\n## US-119 — absolute Windows service paths\n- TDD RED proved 7/7 intended Windows path failures before production changes: caller-CWD RexSpeak launch, unnormalized lean-node root, relative registration path, missing executable normalizer, raw service child interpreter, and relative-root/space quoting behavior.\n- GREEN focused Windows gate passed 7/7 on a real Windows runner, including invocation from a non-repo working directory with a relative install root containing spaces.\n- `Start-RexSpeak.ps1` and `install.ps1` now root from normalized `$PSScriptRoot`; the lean-node installer normalizes `$RexRoot`, quotes the absolute interpreter, and fails closed if it is missing.\n- `rex.windows_service_paths.normalize_existing_executable()` is the shared fail-closed executable normalizer; `rex.windows_service` normalizes `sys.executable` before launching its child.\n- Exact implementation head `8b786aa7287eeded95f36f0956e44070003e33b6` passed full Python tests/coverage/integration/clean-tree, Ruff, Black, mypy, pre-commit, security/dependency/secret gates, GUI test/typecheck/lint/build, wheel smoke, and skipped-test inventory.\n- Windows Electron Artifact passed PowerShell parsing, focused US-119 contracts, managed runtime/installer build, package-resource validation, and installed-artifact exercise without machine Python or Node.\n- Evidence boundary: US-119 proves executable-path/service-registration reliability only; it does not claim physical microphone/speaker/wake-word/reboot acceptance, which remains US-130.\n'''
          current = progress.read_text()
          if '## US-119 — absolute Windows service paths' not in current:
              progress.write_text(current.rstrip() + '\n' + evidence)
          PY
      - name: Commit docs and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md PRD-production-readiness.md docs/archive/progress/progress-production-readiness.txt
          git rm .github/workflows/us119-finalize.yml
          git commit -m "docs(runtime): finalize US-119 verification evidence"
          git push origin HEAD:lead/us119-absolute-service-paths
