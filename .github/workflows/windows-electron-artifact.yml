name: Windows Electron Artifact

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/windows-electron-artifact.yml"
      - "bridge/**"
      - "gui/**"
      - "rex/**"
      - "scripts/build_managed_python_runtime.ps1"
      - "scripts/test_installed_electron_artifact.ps1"
      - "scripts/verify_electron_package_contents.py"
      - "requirements-electron-*.txt"
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installed-artifact:
    name: Installed Windows Electron artifact
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell artifact scripts
        shell: powershell
        run: |
          $parseErrors = @()
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/test_installed_electron_artifact.ps1'),
            [ref]$null,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Install exact build tools
        run: python -m pip install "build==1.3.0"

      - name: Install exact GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build wheel
        run: python -m build --wheel

      - name: Build managed runtime and installer
        working-directory: gui
        run: npm run dist

      - name: Reject missing or private packaged resources
        run: python scripts/verify_electron_package_contents.py gui/dist/win-unpacked/resources

      - name: Exercise installed artifact without machine Python or Node
        shell: powershell
        run: |
          scripts/test_installed_electron_artifact.ps1 `
            -Installer "gui/dist/AskRex Setup 1.0.0.exe" `
            -BuildPython python `
            -DiagnosticsPath "$env:RUNNER_TEMP\askrex-artifact-smoke.json"

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: askrex-windows-smoke-diagnostics
          path: ${{ runner.temp }}\askrex-artifact-smoke.json
          if-no-files-found: warn

      - name: Upload installer evidence
        uses: actions/upload-artifact@v4
        with:
          name: askrex-windows-installer
          path: |
            gui/dist/AskRex Setup 1.0.0.exe
            gui/dist/latest.yml
          if-no-files-found: error
