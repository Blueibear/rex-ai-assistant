name: Refresh GUI PostCSS Lock

on:
  push:
    branches:
      - codex/audit-remediation
    paths:
      - .github/workflows/refresh-gui-postcss-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/audit-remediation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Update PostCSS and validate audit
        working-directory: gui
        run: |
          npm install --save-dev "postcss@^8.5.18" --package-lock-only
          npm audit --audit-level=high

      - name: Commit refreshed dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui/package.json gui/package-lock.json
          git diff --cached --check
          git commit -m "fix(deps): update PostCSS security patch"
          git push origin HEAD:codex/audit-remediation
