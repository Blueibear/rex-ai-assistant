name: Refresh GUI PostCSS Lock

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/refresh-gui-postcss-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'codex/audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Regenerate and validate dependency lock
        working-directory: gui
        run: |
          npm install --package-lock-only
          npm audit --audit-level=high
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Update lockfile through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_TOKEN"]
          path = "gui/package-lock.json"
          api_url = f"https://api.github.com/repos/{repository}/contents/{path}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "askrex-lock-refresh",
          }

          get_request = urllib.request.Request(
              f"{api_url}?ref={urllib.parse.quote(branch)}",
              headers=headers,
          )
          with urllib.request.urlopen(get_request) as response:
              current_sha = json.load(response)["sha"]

          with open(path, "rb") as lock_file:
              content = base64.b64encode(lock_file.read()).decode("ascii")

          payload = json.dumps(
              {
                  "message": "fix(deps): update GUI dependency lock",
                  "content": content,
                  "sha": current_sha,
                  "branch": branch,
              }
          ).encode("utf-8")
          put_request = urllib.request.Request(
              api_url,
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(put_request) as response:
              result = json.load(response)
          print(result["commit"]["sha"])
          PY
