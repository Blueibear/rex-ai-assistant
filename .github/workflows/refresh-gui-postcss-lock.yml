name: Refresh GUI PostCSS Lock

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/refresh-gui-postcss-lock.yml

permissions:
  contents: read

jobs:
  refresh-lock:
    if: github.head_ref == 'codex/audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Update PostCSS and capture audit details
        working-directory: gui
        run: |
          npm install --save-dev "postcss@^8.5.18" --package-lock-only
          npm audit --audit-level=high --json > ../gui-audit.json || true

      - name: Upload generated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: gui-postcss-lock-refresh
          path: |
            gui/package.json
            gui/package-lock.json
            gui-audit.json
          if-no-files-found: error
