name: Refresh GUI PostCSS Lock

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/refresh-gui-postcss-lock.yml

permissions:
  contents: read

jobs:
  refresh-lock:
    if: github.head_ref == 'codex/audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Upgrade affected tooling and capture validation
        working-directory: gui
        shell: bash
        run: |
          npm install --save-dev \
            "postcss@^8.5.23" \
            "electron-builder@26.15.7" \
            "eslint@^10.8.0" \
            "@eslint/js@^10.0.1"

          set +e
          npm audit --audit-level=high --json > ../gui-audit.json
          echo $? > ../gui-audit-exit.txt
          npm run lint > ../gui-lint.log 2>&1
          echo $? > ../gui-lint-exit.txt
          npm run typecheck > ../gui-typecheck.log 2>&1
          echo $? > ../gui-typecheck-exit.txt
          npm test > ../gui-test.log 2>&1
          echo $? > ../gui-test-exit.txt
          npm run build > ../gui-build.log 2>&1
          echo $? > ../gui-build-exit.txt
          set -e

      - name: Upload generated dependency files and validation
        uses: actions/upload-artifact@v4
        with:
          name: gui-postcss-lock-refresh
          path: |
            gui/package.json
            gui/package-lock.json
            gui-audit.json
            gui-audit-exit.txt
            gui-lint.log
            gui-lint-exit.txt
            gui-typecheck.log
            gui-typecheck-exit.txt
            gui-test.log
            gui-test-exit.txt
            gui-build.log
            gui-build-exit.txt
          if-no-files-found: error
