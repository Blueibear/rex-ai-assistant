name: Refresh GUI PostCSS Lock

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/refresh-gui-postcss-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'codex/audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Upgrade and validate affected tooling
        working-directory: gui
        run: |
          npm pkg set overrides.brace-expansion=5.0.8
          npm install --save-dev \
            "postcss@^8.5.23" \
            "electron-builder@26.15.7" \
            "eslint@^10.8.0" \
            "@eslint/js@^10.0.1"
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit refreshed dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gui/package.json gui/package-lock.json
          git diff --cached --check
          git commit -m "fix(deps): remediate GUI dependency advisories"
          git push origin HEAD:${{ github.head_ref }}
