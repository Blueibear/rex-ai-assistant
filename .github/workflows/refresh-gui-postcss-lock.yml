name: Refresh GUI PostCSS Lock

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/refresh-gui-postcss-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'codex/audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Upgrade and validate affected tooling
        working-directory: gui
        run: |
          npm pkg set overrides.brace-expansion=5.0.8
          npm install --save-dev \
            "postcss@^8.5.23" \
            "electron-builder@26.15.7" \
            "eslint@^10.8.0" \
            "@eslint/js@^10.0.1"
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Update dependency files through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          update_file() {
            local path="$1"
            local message="$2"
            local sha
            local content
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${TARGET_BRANCH}" --jq .sha)
            content=$(base64 -w 0 "${path}")
            jq -n \
              --arg message "${message}" \
              --arg content "${content}" \
              --arg sha "${sha}" \
              --arg branch "${TARGET_BRANCH}" \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' > update-request.json
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" --input update-request.json
          }

          update_file gui/package.json "fix(deps): update GUI dependency manifest"
          update_file gui/package-lock.json "fix(deps): update GUI dependency lock"
