name: US-119 Secret Baseline Refresh

on:
  push:
    branches: [lead/us119-absolute-service-paths]
    paths:
      - ".github/workflows/us119-baseline-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lead/us119-absolute-service-paths
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate detect-secrets baseline metadata
        run: |
          python -m pip install pre-commit
          pre-commit run detect-secrets --all-files || true
          git diff -- .secrets.baseline
      - name: Commit deterministic baseline and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .secrets.baseline
          git rm .github/workflows/us119-baseline-refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(security): refresh US-119 secret baseline metadata"
          git push origin HEAD:lead/us119-absolute-service-paths
