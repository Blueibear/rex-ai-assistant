name: Collect Failed Job Logs

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/collect-failed-job-logs.yml

permissions:
  actions: read
  contents: read

jobs:
  collect:
    if: github.head_ref == 'codex/audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract failed logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          collect_log() {
            local job_id="$1"
            local name="$2"
            gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > "${name}.download"
            if unzip -t "${name}.download" >/dev/null 2>&1; then
              unzip -p "${name}.download" > "${name}.full.log"
            else
              cp "${name}.download" "${name}.full.log"
            fi
            tail -n 800 "${name}.full.log" > "${name}.tail.log"
          }
          collect_log 90100536703 python-tests
          collect_log 90100536942 windows-artifact

      - name: Upload focused log tails
        uses: actions/upload-artifact@v4
        with:
          name: failed-job-log-tails
          path: |
            python-tests.tail.log
            windows-artifact.tail.log
          if-no-files-found: error
