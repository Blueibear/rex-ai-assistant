name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  windows-electron-artifact:
    uses: ./.github/workflows/windows-electron-artifact.yml

  release-please:
    needs: windows-electron-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
